# Exact, justified W2/W3 governance finding keys. Baselined findings remain visible reports.
#
# AG3-179 (2026-08-02, Codex-Review Runde 2): Die acht hier zeitweise gefuehrten
# `UNAUTHORIZED_SCOPE_ASSERTION`-Eintraege aus FK-93 §93.9a sind wieder
# ENTFERNT. Sie waren kein False Positive, sondern genau der Befund, den W2
# erzeugen soll: FK-93 trug `authority_over: [defaults]` und `defers_to: []`,
# waehrend jede Katalogzeile einen anderswo besessenen Wert wiedergibt. Die
# Baseline-Begruendungen benannten die fehlenden scope-qualifizierten
# `defers_to`-Kanten selbst als Ursache — eine Baseline ueber eine bekannte,
# benannte Modellierungsluecke ist Unterdrueckung, kein Befundmanagement.
#
# Behoben ist stattdessen die Ursache: FK-93 traegt jetzt je Abschnitt eine
# scope-qualifizierte `defers_to`-Kante auf den Owner der wiedergegebenen Werte,
# und §93.0.1 macht diese Kante zur Pflegeregel des Katalogs.
