# Drittes unabhaengiges Codex-Review: landefaehig NEIN, 5 ERROR + 2 WARNING.
# Alle sieben an der Wurzel behoben. Runde 3 geht erneut ins Review.
#
#  R1 (ERROR, SCHWERSTER BEFUND DER STORY) Der Mutex-Erwerb arbitrierte nicht
#     exklusiv: _acquire_mutex nutzte Path.exists() + os.replace statt
#     O_CREAT|O_EXCL -- also genau die Existenzpruefung, die _file_is_absent
#     wenige hundert Zeilen weiter oben als untauglich beschreibt, weil sie bei
#     Stat-/IO-Fehlern False liefert. Ein lebender FREMDER Mutex mit
#     voruebergehend scheiterndem stat wurde mit der eigenen Nonce
#     ueberschrieben: aus UNVERIFIABLE wurde beim Erwerb still GONE. Das ist ein
#     SAFETY-Defekt (zwei Schreiber behaupten gleichzeitig Alleineigentum),
#     kein Liveness-Defekt, und er ist AELTER als diese Story -- drei
#     Reviewrunden haben ihn nicht gesehen. Behoben: exklusiver Create;
#     FileExistsError -> validierter Takeover; jeder andere OSError ->
#     fail-closed; gescheiterter Payload-Write gibt den Anspruch zurueck
#     (permanent=True, weil ein leerer RUN.mutex NIE per TTL uebernommen wird).
#     _unreadable_mutex_problem() wendet die _Ownership-Klassifikation aus
#     Runde 2 auch hier an. 4 neue Tests, alle gegen die alte Fassung rot.
#     KEINE Lockerung: FK-78 §78.4 sagt O_CREAT|O_EXCL fuer RUN.mutex seit
#     jeher -- der Code loeste die Zusage nur nicht ein.
#  R2 (ERROR) Ein nach Klinken-TTL fortgesetzter Releaser loeschte den Mutex
#     seines Nachfolgers: _delete_own_mutex las die Nonce und loeschte danach
#     nur nach PFAD. A haelt I1 und stockt ueber die TTL; B sammelt I1 ein,
#     erwirbt I2, uebernimmt den abgelaufenen Mutex und schreibt M2; A setzt
#     fort und loescht M2 -- den Mutex eines LEBENDEN Eigentuemers.
#     ENTSCHEIDUNG (begruendet im Code, nicht nur im Bericht): den Verlust der
#     Klinke zu VERHINDERN ist unmoeglich -- ein eingefrorener Prozess kann
#     keinen Heartbeat senden und ist durch keine Frist von einem toten zu
#     unterscheiden; genau deshalb hat die Klinke eine TTL. Gewaehlt ist daher
#     ERKENNUNG: die geschuldete Mutex-Loeschung laeuft unter dem bereits
#     normierten Advisory-Lock und weist DARUNTER erneut nach, dass die Klinke
#     noch die eigene ist. Weil jedes Einsammeln einer Klinke den Lock braucht
#     und jede Mutex-Uebernahme die Klinke, ordnet der Kern beide Ereignisse.
#     Klinke verloren = nicht geloescht: fremder Mutex bleibt ohne Befund, noch
#     eigener wird zur geschuldeten, nicht erledigten Wirkung (Rand 2.4).
