  - importer: agentkit.backend.governance.runner
    imported: agentkit.backend.governance.guard_system.records
    symbols: [GuardDecision, GuardDecisionOutcome]
    answer: a
    remedy_owner: OPEN -- kein Eigentuemer zugewiesen, Entscheid beim PO
    owner_note: >-
      Review Runde 3 hat den Endpunkt `/v1/governance/guard-decisions`
      ausdruecklich freigegeben, mit zwei Bedingungen: er darf den synchronen
      Entscheidungspfad nicht blockieren (FK-01 §1.2.3), und ein verlorener
      Record darf nicht STILL verloren gehen. Beides ist gleichzeitig erfuellbar
      -- lokaler, fsync-fester Spool im Hook, spaetere Uebertragung -- der
      synchrone Pfad zahlt dann nur einen lokalen Append, keinen Netzaufruf.
      **Ich baue ihn in dieser Runde trotzdem nicht, und das ist eine
      Entscheidung, keine Kapitulation.** Drei Gruende, alle belegbar:
      (1) Der ERZEUGER ist nicht verdrahtet. `GuardRunner` hat den typisierten
      Sink `_GuardDecisionSink` (runner.py:97), aber `guard_evaluation.py:114`
      konstruiert `GuardRunner(guards=...)` ohne ihn, und in `src/` injiziert ihn
      niemand. Ein Endpunkt haette nichts zu empfangen; zuerst muss der Sink
      gefuellt werden.
      (2) Der Sink darf auf dem Edge weder Datenbank noch Netz sein. Damit ist
      der Spool die einzige korrekte Edge-Senke -- und ein Spool, den niemand
      leert, ist ein Outbox ohne Drain, also genau der halbfertige Uebergang,
      den ZERO DEBT verbietet. Beide Haelften gehoeren in einen Schnitt.
      (3) Die Dauerhaftigkeitszusage ist eine NORMATIVE Frage, die ich nicht
      erfinden darf: Muss die Entscheidung persistiert sein, BEVOR der Block
      wirkt (audit-before-act), oder genuegt danach? Und wenn der
      Entwicklerrechner ausfaellt, bevor der Spool uebertragen ist -- ist der
      Audit dann verloren oder nie entstanden? Die Antwort bestimmt den
      Mechanismus, nicht umgekehrt.
      Was gebaut werden muss, damit es in EINEM Schnitt geht: Wire-Modell fuer
      die Entscheidung, `POST /v1/governance/guard-decisions` mit `op_id`-
      Idempotenz gegen das vorhandene `guard_decision_repository`, ein
      fsync-fester Edge-Spool als `_GuardDecisionSink`, ein benannter
      Drain-Zeitpunkt, und Crash-Replay-Tests. Owner-Vorschlag: AG3-239 in einem
      Folgeschnitt oder AG3-209; der PO entscheidet zusammen mit der
      Dauerhaftigkeitszusage aus (3).
    group: G4
    endpoint: POST /v1/governance/guard-decisions (noch nicht gebaut)
    reason: >-
      **Korrigiert in Review Runde 1: die vorherige Antwort (b) "edge-internal"
      war sachlich falsch.** `GuardDecision` ist kein Edge-Interna, sondern ein
      **kanonischer, append-only Audit-Record** (FK-18 §173,
