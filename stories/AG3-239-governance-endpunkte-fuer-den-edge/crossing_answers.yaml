# AG3-239 AC 1 -- one answer per boundary crossing of the bounded context
# `governance-and-guards`.
#
# The population is the output of
#   .venv\Scripts\python stories/AG3-239-governance-endpunkte-fuer-den-edge/\
#       measure_boundary_violations.py --bc agentkit.backend.governance
# measured 2026-08-07: 64 unique ordered module pairs (54 edge-to-core,
# 10 core-to-edge). `check_crossing_answers.py` proves that this file answers
# exactly that population -- no pair without an answer, no answer without a
# pair.
#
# answer:
#   a -- belongs over the interface: a /v1 endpoint carries it
#   b -- edge logic filed on the wrong side, or vocabulary that belongs in the
#        contract package: the module or the symbol MOVES, no endpoint
#   c -- must not happen at all: the call is removed
#
# remedy_owner names the story that can execute the answer. Where it is not
# AG3-239, the reason is that the answer's remedy is an explicitly named
# out-of-scope item of this story (story.md, "Out of Scope").

measurement:
  command: >-
    .venv\Scripts\python
    stories/AG3-239-governance-endpunkte-fuer-den-edge/measure_boundary_violations.py
    --bc agentkit.backend.governance
  measured_on: "2026-08-07"
  unique_ordered_pairs: 48
  edge_to_core: 44
  core_to_edge: 4
  import_statements: 109
  distinct_imported_symbols: 51
  start_value:
    unique_ordered_pairs: 64
    edge_to_core: 54
    core_to_edge: 10
    note: >-
      Ausgangsmessung vor jeder Aenderung, mit demselben Kommando gerechnet.
  owner_split:
    executable_by_ag3_239: 16
    foreign_or_open_owner: 32
    blocked_true_flag: 29
    arithmetic: >-
      32 - 4 + 1 = 29. Review Runde 3 hat die frueher hier stehende Erklaerung
      zurecht als falsch zurueckgewiesen; sie ist neu GERECHNET, nicht neu
      behauptet.
      Von den 32 fremden/offenen Posten tragen VIER kein `blocked`-Flag: die drei
      Worker-Health-Ueberquerungen (AG3-246) und der offene `GuardDecision`-Posten
      -- sie warten auf keine fehlende Vorbedingung, sondern nur auf eine andere
      Story. Umgekehrt traegt EIN AG3-239-eigener Posten das Flag sehr wohl:
      `principal_capabilities.operations` (die beiden Operations-IDs wandern mit
      dem Dispatcher, sind aber im Spec wire-relevant).
      `resolve_operating_mode` ist NICHT mehr Teil der Differenz: es ist seit
      Runde 3 nicht mehr offen, sondern AG3-240 zugewiesen, und traegt `blocked`.
    open_without_owner:
      - agentkit.backend.governance.guard_system.records
  remaining_own_moves_are_not_independently_executable:
    measured_on: "2026-08-08"
    claim_under_test: >-
      Review Runde 3 erwartete, dass das Ausfuehren der AG3-239-eigenen
      (b)-Bewegungen die Zahl auf 32 bringt.
    result: >-
      Widerlegt. Als Reklassifikation heute ausgefuehrt
      (guards, capability_blocks, hook_ids, principal_capabilities -> edge)
      steigt der BC von 48 auf 68 und der Repo-Gesamtstand von 329 auf 349.
      Die Bewegung ERZEUGT mehr Verletzungen, als sie aufloest.
    why: >-
      Zwei Abhaengigkeiten, beide fremd-owned:
      (1) `principal_capabilities.principals` wird von SIEBEN Kern-Modulen
      importiert (control_plane.runtime._admin, _ownership_transfer*,
      control_plane_http.story_admin_routes / story_split_routes /
      takeover_handlers). `Principal` ist Kern-Adjudikationsvokabular, nicht
      edge-intern -- eine Verschiebung nach edge macht aus sieben Kern-Importen
      sieben neue Verletzungen.
      (2) Jeder Guard haengt an `governance.protocols` (wire-DEFERRED,
      `ag3_209_precondition`) und an `guard_system.protected_paths`
      (kern-geteilt, u. a. verify_system.adversarial_orchestrator).
    consequence: >-
      Die 16 eigenen (b)-Antworten sind fachlich richtig und bleiben stehen, aber
      sie sind NICHT unabhaengig ausfuehrbar: sie warten auf dieselben zwei
      Vorbedingungen wie die 29 blockierten Posten -- die Zerlegung der
      zurueckgestellten Vokabularsymbole (AG3-209) und den Symbolschnitt von
      `guard_system` in Guard-Klassen (edge) gegen Records/Paths/Patterns (kern).
      AC 2 (null Verletzungen) ist damit fuer diesen BC erst nach AG3-209
      erreichbar. Das ist eine gemessene Aussage, keine Schaetzung -- das
      Kommando steht oben, das Ergebnis ist reproduzierbar.
  progress:
    - step: "M3 -- struktureller Eingangs-Port (der Endpunkt ist zurueckgebaut)"
      removed: 3
      added: 0
      net: 50
      note: >-
        Runde 1 baute hier `POST /v1/governance/capability-adjudications`.
        **Review Runde 2 hat ihn als normativ falsch verworfen und er ist
        vollstaendig zurueckgebaut** -- FK-01 §1.2.3 verbietet einen
        Netz-Roundtrip pro Werkzeugaufruf, und die Adjudikation ist genau das.
        Die Messung zeigt, dass er ohnehin nichts geloest hat: 50 Paare mit
        Endpunkt, 50 ohne.
        Was BLEIBT und die drei Ueberquerungen tatsaechlich geloest hat, ist der
        strukturelle Eingangs-Port. Entfallen sind die drei Rueckkanten
        `principal_capabilities.{enforcement,principals,service_paths} ->
        guard_evaluation` -- geloest durch einen strukturellen Eingangs-Port
        (`principal_capabilities/adjudication_input.py`) statt durch einen
        Typumzug: `HookEvent` kann nicht ins Vertragspaket (Huelle offen,
        `Path.cwd()`), aber ein Port braucht keinen Umzug. Vorbild im Repo:
        `operating_mode_resolver.CarriesOperatingMode`.
        Ein Gewinn des Runde-1-Umbaus ist BEWUSST behalten worden:
        `FreezeRepository`
        ist aus dem Hook-Prozess verschwunden und bleibt draussen. Der Freeze wird
        jetzt ueber den LOKALEN Export konsultiert
        (`ConflictFreezeOverlay(local_export=...)`), ohne Datenbank und ohne
        Netzaufruf. Das erfuellt beides zugleich: FK-01 §1.2.3 (lokale
        Entscheidung) und AG3-209 AC 3 ("aus dem Hook-Prozess ist weder psycopg
        noch ein Postgres-Repository erreichbar"). Der Zustand vor dieser Story
        konstruierte `FreezeRepository(project_root)` im kurzlebigen Hook-Prozess;
        das ist weg. `runner -> freeze_repository` traegt deshalb nur noch
        `LocalFreezeJsonExport`.
    - step: "M1 -- Vertragspaket src/agentkit_wire angelegt"
      removed: 6
      added: 0
      net: 53
      note: >-
        Vier Symbole sind gewandert, genau an den Ort, den
        distribution_symbol_boundaries ihnen zuweist: HookDefinition und
        HookEventName nach agentkit_wire.governance_registration, TelemetryConfig
        nach agentkit_wire.project_config, GuardCounterMutationRequest nach
        agentkit_wire.control_plane_mutations. Der alte Ort ist jeweils weg --
        kein Re-Export, keine zweite Aufloesung; erzwungen von
        tests/contract/wire/test_wire_package_purity.py.
        Die Messung hielt beim ersten Lauf nach dem Anlegen fail-closed an, weil
        `agentkit_wire` von der Klassifikation nicht beansprucht war; der Praefix
        steht jetzt in entities.md. Zusaetzlich korrigiert: eine Kante NACH wire
        ist keine Verletzung, sondern der Mechanismus, der eine ersetzt.
    - step: "M2b -- Governance auf seine EINE Operation zurueckgeschnitten"
      removed: 2
      added: 0
      net: 59
      note: >-
        `register_hooks` persistiert ueber das Repository UND schreibt
        `.claude/settings.json` / `.codex/hooks.json` auf den Entwicklerrechner.
        Die zweite Haelfte kann der Kern nicht, also ist der zusammengesetzte
        Vorgang Edge-Orchestrierung; er liegt jetzt in
        `installer.writer_client.InstallerHookGovernance`. Damit entfallen
        `administration -> settings_writer` (Kern schreibt auf den Laptop) und
        `installer.writer_client -> administration`. Nebenwirkung ohne eigene
        Ueberquerung, aber derselbe Defekt: FUENF von fuenf Konstruktionsstellen
        lieferten eine Attrappe fuer die nicht benutzte Haelfte, und zwar in
        BEIDE Richtungen. Vier lieferten den ungenutzten HOOK-Teil
        (`composition_closure.py:446`, `composition_project.py:39,174,353` -- ein
        direkt an die DB gebundenes `StateBackendHookRegistrationRepository`, das
        nie gerufen wurde; drei davon im edge-klassifizierten Composition-Root).
        Die fuenfte, `installer/writer_client.py:438`, lieferte den ungenutzten
        LOCK-Teil: ein fail-closed `_UnavailableInstallerLockRepository`, das
        beim Anfassen wirft. Alle fuenf Attrappen sind weg. (Review Runde 1
        korrigierte hier "vier von vier" -- die Installer-Stelle fehlte, und sie
        ist die aussagekraeftigste, weil sie in die andere Richtung faelscht.)
    - step: "M2 -- Symbolschnitt governance.runner"
      removed: 6
      added: 3
      net: 61
      note: >-
        Sechs Ueberquerungen entfallen (story_reset_adapters -> runner,
        governance -> runner, runner -> errors/locks/repository/
        lock_record_repository). Drei neue treten hervor -- sie sind keine
        Regression, sondern Defekte, die der Schnitt SICHTBAR gemacht hat: der
        Edge-Composition-Root und der Installer bauen den Kern-Service direkt,
        und der Kern-Service schreibt Harness-Settings auf den Entwicklerrechner.
        Vorher waren alle drei hinter dem gemischten Modul verborgen.
  deviation_from_story_startwert: >-
    story.md names 42 pairs (33 edge-to-core, 9 core-to-edge) as the starting
    value of the pre-measurement. The own measurement yields 64 (54 / 10). The
    own measurement is the one that counts, and it is not merely an assertion
    against the pre-measurement: filtered to `agentkit.backend.governance`, the
    frozen list `distribution_boundary_violations.pairs` in
    concept/formal-spec/architecture-conformance/entities.md contains exactly
    the same 64 pairs -- set-identical, direction-identical, zero symmetric
    difference. The 42 of story.md is reproducible from no artefact in the
    repository and is discarded.

# ---------------------------------------------------------------------------
# Widerlegte Befunde. Sie stehen hier, WEIL sie einmal behauptet waren --
# kommentarlos entfernen hiesse, die Pruefung unsichtbar zu machen.
# ---------------------------------------------------------------------------
refuted_findings:
  - id: AG3-239.refuted.lock_deactivation_is_not_project_scoped
    raised_in: Review Runde 1 (vom Koordinator eingebracht)
    claim: >-
      `LockRecordRepository.deactivate_locks_for_story(story_id)` nimmt keinen
      `project_key`, obwohl der Primaerschluessel der Tabelle
      `(project_key, story_id, run_id, lock_type)` ist; in einer
      Mehrprojekt-Installation koennten zwei Projekte dieselbe Story-ID fuehren
      und ein Aufruf die Locks beider deaktivieren.
    verdict: widerlegt
    refutation: >-
      Die Vorbedingung trifft nicht zu: Story-IDs sind global eindeutig, nicht
      nur projektweit. FK-18 §250 fuehrt `story_display_id` als **global
      UNIQUE**; FK-73 §88 macht die Projektpraefixe eindeutig, aus denen die
      Anzeige-ID gebildet wird; `postgres_schema.sql:21` setzt beides um. Zwei
      Projekte KOENNEN dieselbe Story-ID also nicht fuehren.
      Der zusammengesetzte Lock-Primaerschluessel beweist die Behauptung nicht:
      er existiert, um mehrere Lock-Typen und Runs pro Story zu unterscheiden,
      nicht um Stories zwischen Projekten zu trennen. Aus "der PK hat vier
      Spalten" folgt nicht, dass jede Aggregat-Operation alle vier nehmen muss --
      `deactivate_locks_for_story` operiert bewusst ueber ALLE Runs und
      Lock-Typen einer Story.
    consequence: >-
      Kein Handlungsbedarf, kein Adressat, keine Folgestory. Der Eintrag bleibt
      als Widerlegung stehen, damit die Frage nicht ein zweites Mal gestellt wird.

