# ---------------------------------------------------------------------------
# Widerlegte Befunde. Sie stehen hier, WEIL sie einmal behauptet waren --
# kommentarlos entfernen hiesse, die Pruefung unsichtbar zu machen.
# ---------------------------------------------------------------------------
refuted_findings:
  - id: AG3-239.refuted.lock_deactivation_is_not_project_scoped
    raised_in: Review Runde 1 (vom Koordinator eingebracht)
    claim: >-
      `LockRecordRepository.deactivate_locks_for_story(story_id)` nimmt keinen
      `project_key`, obwohl der Primaerschluessel der Tabelle
      `(project_key, story_id, run_id, lock_type)` ist; in einer
      Mehrprojekt-Installation koennten zwei Projekte dieselbe Story-ID fuehren
      und ein Aufruf die Locks beider deaktivieren.
    verdict: widerlegt
    refutation: >-
      Die Vorbedingung trifft nicht zu: Story-IDs sind global eindeutig, nicht
      nur projektweit. FK-18 §250 fuehrt `story_display_id` als **global
      UNIQUE**; FK-73 §88 macht die Projektpraefixe eindeutig, aus denen die
      Anzeige-ID gebildet wird; `postgres_schema.sql:21` setzt beides um. Zwei
      Projekte KOENNEN dieselbe Story-ID also nicht fuehren.
      Der zusammengesetzte Lock-Primaerschluessel beweist die Behauptung nicht:
      er existiert, um mehrere Lock-Typen und Runs pro Story zu unterscheiden,
      nicht um Stories zwischen Projekten zu trennen. Aus "der PK hat vier
      Spalten" folgt nicht, dass jede Aggregat-Operation alle vier nehmen muss --
      `deactivate_locks_for_story` operiert bewusst ueber ALLE Runs und
      Lock-Typen einer Story.
    consequence: >-
      Kein Handlungsbedarf, kein Adressat, keine Folgestory. Der Eintrag bleibt
      als Widerlegung stehen, damit die Frage nicht ein zweites Mal gestellt wird.

