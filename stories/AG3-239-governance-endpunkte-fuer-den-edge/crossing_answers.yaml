# AG3-239 AC 1 -- one answer per boundary crossing of the bounded context
# `governance-and-guards`.
#
# The population is the output of
#   .venv\Scripts\python stories/AG3-239-governance-endpunkte-fuer-den-edge/\
#       measure_boundary_violations.py --bc agentkit.backend.governance
# measured 2026-08-07: 64 unique ordered module pairs (54 edge-to-core,
# 10 core-to-edge). `check_crossing_answers.py` proves that this file answers
# exactly that population -- no pair without an answer, no answer without a
# pair.
#
# answer:
#   a -- belongs over the interface: a /v1 endpoint carries it
#   b -- edge logic filed on the wrong side, or vocabulary that belongs in the
#        contract package: the module or the symbol MOVES, no endpoint
#   c -- must not happen at all: the call is removed
#
# remedy_owner names the story that can execute the answer. Where it is not
# AG3-239, the reason is that the answer's remedy is an explicitly named
# out-of-scope item of this story (story.md, "Out of Scope").

measurement:
  command: >-
    .venv\Scripts\python
    stories/AG3-239-governance-endpunkte-fuer-den-edge/measure_boundary_violations.py
    --bc agentkit.backend.governance
  measured_on: "2026-08-07"
  unique_ordered_pairs: 59
  edge_to_core: 51
  core_to_edge: 8
  import_statements: 129
  distinct_imported_symbols: 53
  start_value:
    unique_ordered_pairs: 64
    edge_to_core: 54
    core_to_edge: 10
    note: >-
      Ausgangsmessung vor jeder Aenderung, mit demselben Kommando gerechnet.
  progress:
    - step: "M2b -- Governance auf seine EINE Operation zurueckgeschnitten"
      removed: 2
      added: 0
      net: 59
      note: >-
        `register_hooks` persistiert ueber das Repository UND schreibt
        `.claude/settings.json` / `.codex/hooks.json` auf den Entwicklerrechner.
        Die zweite Haelfte kann der Kern nicht, also ist der zusammengesetzte
        Vorgang Edge-Orchestrierung; er liegt jetzt in
        `installer.writer_client.InstallerHookGovernance`. Damit entfallen
        `administration -> settings_writer` (Kern schreibt auf den Laptop) und
        `installer.writer_client -> administration`. Nebenwirkung ohne eigene
        Ueberquerung, aber derselbe Defekt: vier von vier Konstruktionsstellen
        lieferten eine Attrappe fuer die nicht benutzte Haelfte -- drei davon ein
        direkt an die DB gebundenes `StateBackendHookRegistrationRepository` im
        edge-klassifizierten Composition-Root. Alle vier Attrappen sind weg.
    - step: "M2 -- Symbolschnitt governance.runner"
      removed: 6
      added: 3
      net: 61
      note: >-
        Sechs Ueberquerungen entfallen (story_reset_adapters -> runner,
        governance -> runner, runner -> errors/locks/repository/
        lock_record_repository). Drei neue treten hervor -- sie sind keine
        Regression, sondern Defekte, die der Schnitt SICHTBAR gemacht hat: der
        Edge-Composition-Root und der Installer bauen den Kern-Service direkt,
        und der Kern-Service schreibt Harness-Settings auf den Entwicklerrechner.
        Vorher waren alle drei hinter dem gemischten Modul verborgen.
  deviation_from_story_startwert: >-
    story.md names 42 pairs (33 edge-to-core, 9 core-to-edge) as the starting
    value of the pre-measurement. The own measurement yields 64 (54 / 10). The
    own measurement is the one that counts, and it is not merely an assertion
    against the pre-measurement: filtered to `agentkit.backend.governance`, the
    frozen list `distribution_boundary_violations.pairs` in
    concept/formal-spec/architecture-conformance/entities.md contains exactly
    the same 64 pairs -- set-identical, direction-identical, zero symmetric
    difference. The 42 of story.md is reproducible from no artefact in the
    repository and is discarded.

