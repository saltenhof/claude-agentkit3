      Verletzungszahl erhoeht statt gesenkt, was die What-if-Messung dieser
      Story auch gezeigt hat (64 -> 98).
      Richtig ist die Arbeitsteilung: der Edge ERZEUGT die Entscheidung im
      Hook-Prozess, aber das kanonische Anhaengen gehoert dem Kern und braucht
      `/v1`-Mediation. Das ist ein eigener fachlicher Vorgang (Audit-Append),
      nicht Teil der Adjudikation -- AC 3 verbietet, ihn in den
      Adjudikations-Endpunkt hineinzuziehen.
    related_finding: >-
      Beim Nachpruefen sichtbar geworden: produktiv wird derzeit **gar kein**
      Decision-Repository injiziert (`guard_evaluation.py:114`) -- der
      Audit-Record entsteht im Hook, wird aber nirgends kanonisch angehaengt.
      Der Endpunkt hat damit nicht nur eine Grenzverletzung zu loesen, sondern
      eine fehlende Persistenz. Owner beider: AG3-245.
