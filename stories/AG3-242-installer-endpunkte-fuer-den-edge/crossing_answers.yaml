# AG3-242 AC 1 -- one answer per boundary crossing of the bounded context
# `installation-and-bootstrap` (`backend/installer/` and `backend/process/language/`).
#
# answer:
#   a -- belongs over the interface: a /v1 endpoint carries it
#   b -- filed on the wrong side, or vocabulary that belongs in the contract
#        package: the module or the symbol MOVES, no endpoint
#   c -- must not happen at all: the call is removed
#
# `resolved: true` marks a pair this story already removed. It stays in the file
# because deleting it would hide the answer that removed it; the mark is VERIFIED
# by `check_crossing_answers.py`, not trusted -- a "resolved" pair that is still
# measurable fails the check.
#
# `remedy_owner` names the story that can execute the answer. Where it is not
# AG3-242, the reason names why.
#
# SOURCES OF AUTHORITY USED HERE: `distributions`,
# `distribution_side_election_rules` and
# `architecture-conformance.rule.import_root_follows_distribution_name` in
# `concept/formal-spec/architecture-conformance/entities.md` and
# `.../invariants.md`; FK-91 section 91.1a (the /v1 operation catalog);
# FK-10 section 10.2.3; FK-01 section 1.2.3 (the edge decides locally where the
# fact is local); FK-50 CP 10d.
# `wire_excluded_crossings` is NOT used -- it carries `superseded-no-authority`.

measurement:
  command: >-
    .venv\Scripts\python
    stories/AG3-239-governance-endpunkte-fuer-den-edge/measure_boundary_violations.py
    --bc agentkit.backend.installer --bc agentkit.backend.process.language
  tool_note: >-
    The AG3-239 tool is USED, not copied -- a second copy of a measurement script
    is a second measurement that drifts. One change was made to it, and it is
    numerically inert for AG3-239/240/241 (repo-wide total 294 before and after):
    the pre-split package root `agentkit` is now EXCLUDED and reported instead of
    halting the run. It is not unclassified by omission. The invariant
    `architecture-conformance.rule.import_root_follows_distribution_name` states
    that no distribution and no import root is named `agentkit`, and the totality
    invariant scopes over "every module under the AK3 import root" -- this module
    sits under none of the three. It dissolves into one root per wheel with the
    package migration (AG3-209). Without the exclusion this BC cannot be measured
    at all: `agentkit/__init__.py:93` imports the installer's interpreter guard,
    an import that `scripts/ci/check_interpreter_entrypoints.py` REQUIRES
    (`PACKAGE_BOUNDARY` + `_enforce_installed_runtime_isolation`).
  measured_on: "2026-08-08"
  start_value:
    unique_ordered_pairs: 137
    edge_to_core: 102
    core_to_edge: 35
    import_statements: 241
    distinct_imported_symbols: 55
    repo_wide_unique_ordered_pairs: 294
  end_value:
    unique_ordered_pairs: 132
    edge_to_core: 97
    core_to_edge: 35
    import_statements: 230
    distinct_imported_symbols: 49
    repo_wide_unique_ordered_pairs: 289
  ac2_status: >-
    NOT met, and not reachable inside this story's mandate. 132 crossings remain,
    and NONE of them is a missing operation. Counted by remedy owner:
    75 AG3-209 (modules filed on the wrong side of the tree, or primitives the
    edge must run locally and therefore copies), 36 AG3-237 (contract-package
    vocabulary), 21 the endpoint stories of neighbouring bounded contexts
    (13 AG3-243, 3 AG3-248, 2 AG3-247, 2 AG3-250, 1 AG3-240). The single largest
    item is `installer.paths` with 21 core-to-edge crossings -- that one module
    is why a core process cannot start without the installer package.
  card_deviation: >-
    The story card names 48 pairs (13 edge-to-core, 35 core-to-edge). Measured:
    137 (102 edge-to-core, 35 core-to-edge). The core-to-edge figure is exact;
    the edge-to-core figure on the card undercounts by 89. The card's 13 counts
    only the crossings INSIDE the installer tree and omits the 89 that reach
    other core packages. The measured figure governs (AC 1).

# ---------------------------------------------------------------------------
# AC 3 / AC 4 -- ENDPOINTS
# ---------------------------------------------------------------------------
endpoints: []
endpoint_verdict: >-
  This story builds ZERO new routes, and that is a measured result, not an
  omission. AC 3 forbids an endpoint without a call site it replaces; there is no
  such call site left. The three operations this BC needs already exist -- checked
  at the response model, not at the route name.
  "Zero endpoint CHANGES" would be wrong, and the correction matters: the
  response CONTRACT of the light-validation operation changed. See
  `contract_change` below.
consumption_status: >-
  Precise, because the earlier wording ("all three are already consumed") was too
  strong. Only `validate_third_party` has a productive call site
  (`runner.py:1524`, `_run_cp10d_sonarqube`). `start_branch_plugin_self_test` and
  `reconcile`/`poll_branch_plugin_self_test` exist as client methods with NO
  productive caller outside the client -- which is consistent with
  `installer.invariant.heavy_self_test_is_explicit_async_only`: the heavy
  self-test is started only by an explicit on-demand command and never implicitly
  by register-project or verify-project. The verdict "no endpoint needed" is
  unaffected; its earlier justification was not.

# ---------------------------------------------------------------------------
# The one contract change this story makes, and why it needs no Decision Record
# ---------------------------------------------------------------------------
contract_change:
  model: agentkit.backend.control_plane.third_party_models.ThirdPartyValidationResponse
  operation: POST /v1/projects/{project_key}/installation/third-party-validation
  defect: >-
    The contract was fail-open in two ways at once. It accepted
    `status="PASS"` next to a system whose own result was `FAILED`, and it
    accepted a verdict that omitted a system entirely. The installer reads only
    the aggregate (`runner.py` `_run_cp10d_sonarqube`), so either payload
    produced `CheckpointStatus.PASS` for a precondition that had failed -- a
    preflight reporting green while a system was down.
  enforced_now: >-
    Exactly one result per system and all of `sonar`, `jenkins`, `are` present;
    and the aggregate is FAILED if and only if at least one system is FAILED,
    checked in both directions.
  no_decision_record_because: >-
    No normative statement is created; two existing ones are enforced that the
    code had never honoured. Both were read, not remembered:
    (1) `installer.invariant.third_party_validation_fails_closed`
    (`concept/formal-spec/installer/invariants.md:72-74`) -- "an unreachable
    backend or any applicable unreachable or invalid third system produces a
    visible failed checkpoint and nonzero installer outcome; no dev-side
    fallback, bypass, or silent skip is legal". A green aggregate over a failed
    system is that bypass; an omitted system is that silent skip.
    (2) FK-91 section 91.1 (`91_api_event_katalog.md:118`) -- the response
    "traegt Gesamtentscheid sowie typisiertes Einzelresultat/`error_code` je
    System", which is the completeness half.
    The producer `run_light_validation` already satisfied both; only the contract
    failed to require it. No concept file is touched, therefore no record.
  proven_by:
    - tests/contract/installer/test_third_party_validation_contract.py::TestTheAggregateIsNotFreelyChosen
    - tests/unit/installer/test_cp10d_wiring.py::test_cp10d_fails_closed_on_a_contradictory_backend_verdict
    - tests/unit/installer/test_cp10d_wiring.py::test_cp10d_fails_closed_on_a_verdict_that_omits_a_system

endpoints_that_already_exist:
  - operation: light third-party preflight (Sonar / CI / ARE)
    path: /v1/projects/{project_key}/installation/third-party-validation
    verb: POST
    response_model: ThirdPartyValidationResponse
    core_implementation: agentkit.backend.installer.third_party_light:run_light_validation
    edge_client: agentkit.harness_client.projectedge.client:ProjectEdgeClient.validate_third_party
    productive_call_site: >-
      agentkit.backend.installer.runner:_run_cp10d_sonarqube (runner.py:1524) --
      calls `client.validate_third_party` and fails closed on both
      `ControlPlaneApiError` (HTTP verdict) and any transport failure
      (`third_party_backend_unreachable`). No local fallback exists.
  - operation: heavy branch-plugin conformance self-test
    path: /v1/projects/{project_key}/installation/branch-plugin-self-test
    verb: POST
    response_model: BranchPluginSelfTestOperation
    core_implementation: agentkit.backend.installer.third_party_self_test:execute_branch_plugin_self_test
    edge_client: ProjectEdgeClient.start_branch_plugin_self_test
    productive_call_site: >-
      NONE outside the client. The method exists; no installer path calls it.
      That is the specified behaviour, not a gap:
      `installer.invariant.heavy_self_test_is_explicit_async_only` forbids
      register-project and verify-project from triggering it implicitly.
  - operation: read one long-running operation
    path: /v1/project-edge/operations/{op_id}
    verb: GET
    response_model: BranchPluginSelfTestOperation
    edge_client: ProjectEdgeClient.reconcile_branch_plugin_self_test / poll_branch_plugin_self_test
    productive_call_site: >-
      NONE outside the client; `poll_branch_plugin_self_test` calls
      `reconcile_branch_plugin_self_test`, and both wait for a self-test that no
      productive installer path starts.
open_uncertainty_resolved: >-
  The question whether the validation route covers ALL local checkpoint calls or
  only the light path is answered, and the answer is neither. `check_default_profile`
  was the one checkpoint call the installer still ran locally, and it MUST stay
  local: it asks whether a file exists under the project root, and the project
  root is on the developer machine. Its own module docstring already said so
  ("dev-local pre-send configuration check; no project root crosses into the
  backend") while the function sat in a module the classification calls core.
  That is answer (b), not (a) -- an endpoint would have shipped the developer's
  filesystem question to a machine that cannot see the filesystem. It now lives
  in `agentkit.backend.installer.sonar_local_profile`, with no core import, and
  `integration_checkpoints.sonar_preflight` is mixing-free.
  The scanner harness is not a local call at all: its only importers are the
  core-side self-test service and the removed facade.
after_this_story: >-
  No genuine edge module executes an integration checkpoint locally any more.
  The eight remaining crossings inside the installer tree are seven imports BY
  three core-side services that are merely filed under `installer.`, plus one
  data-only import (`CheckpointStatus`, `SonarPreflightResult`) in the installer
  runner. Command that proves it is in `measurement.command` above.

