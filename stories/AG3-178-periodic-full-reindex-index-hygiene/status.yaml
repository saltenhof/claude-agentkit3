title: "Periodischer Full-Reindex / Index-Hygiene fuer den Konzept-Korpus: inkrementeller Post-Commit-Sync bleibt der Normalpfad, aber ab und zu ein garantierter kompletter Neuaufbau (drop+rebuild) gegen Index-Degeneration/Drift; Trigger primaer ueber Aenderungs-Prozentsatz der Konzeptbasis (optional Zeit-Obergrenze)."
type: implementation
status: blocked
phase: setup
created: "2026-07-30"
