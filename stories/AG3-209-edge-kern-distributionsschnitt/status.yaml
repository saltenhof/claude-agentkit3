# Ohne AG3-237 muesste AG3-209 die gesamte Klassifikation selbst erfinden --
# genau das Raten, das der Schnitt vermeiden soll. Die Vorbedingung von
# distribution_membership_is_total_and_disjoint greift erst, wenn
# pending_symbol_inventory leer ist.
#
# BAUAUFTRAG, der hier bleibt: Das Packaging-Gate existiert heute NICHT.
# architecture_conformance.py implementiert keine Distributionspruefung, und
# `pending_symbol_inventory` kommt in tools/, scripts/, src/ und tests/ nicht
