#
# AG3-208 hat den Distributionsschnitt zielbildhaft gesetzt, die
# Klassifikation der Backend-Subpakete aber VOLLSTAENDIG an AG3-237 abgegeben
# (PO-Entscheid 2026-08-07). Offen sind nicht vier Bereiche, sondern ALLE 44
