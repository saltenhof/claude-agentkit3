# Kein Zwischenstand mit alten und neuen Import-/Installationswegen. Das
# Distribution-Gate landet im selben Diff wie der Schnitt; ein spaeteres Gate
# waere eine nur konventionelle Grenze und widerspraeche dem Decision Record.
# ORCHESTRATOR-ENTSCHEID 2026-08-07: zusaetzliche Abhaengigkeit auf AG3-237.
#
# AG3-208 hat den Distributionsschnitt zielbildhaft gesetzt, die
# Klassifikation der Backend-Subpakete aber VOLLSTAENDIG an AG3-237 abgegeben
# (PO-Entscheid 2026-08-07). Offen sind nicht vier Bereiche, sondern ALLE 44
# unmittelbaren Backend-Subpakete: es gibt kein default_distribution und keine
# Auffangregel mehr. Vier davon -- governance/, installer/,
# control_plane.models und config/{models,defaults,worker_health} -- sind
# bereits als gemischt VERMESSEN und stehen als Eingangsmaterial in
# pending_symbol_inventory; die uebrigen 40 sind schlicht ungemessen.
#
# Ohne AG3-237 muesste AG3-209 die gesamte Klassifikation selbst erfinden --
# genau das Raten, das der Schnitt vermeiden soll. Die Vorbedingung von
# distribution_membership_is_total_and_disjoint greift erst, wenn
# pending_symbol_inventory leer ist.
#
# BAUAUFTRAG, der hier bleibt: Das Packaging-Gate existiert heute NICHT.
# architecture_conformance.py implementiert keine Distributionspruefung, und
# `pending_symbol_inventory` kommt in tools/, scripts/, src/ und tests/ nicht
# vor. Der in AG3-208 spezifizierte Fail-closed-Pfad (NOT_RUN statt PASS,
# blocks_pass: true) ist eine Anweisung an DIESE Story -- er wirkt erst, wenn
# sie ihn baut.
#
# ORCHESTRATOR-ENTSCHEID 2026-08-07 (PO-Entscheid desselben Tages): zusaetzliche
# Abhaengigkeit auf die ZWOELF BC-Endpunktstorys AG3-239..AG3-250.
#
# GRUND: AG3-209s eigener Scope verbietet neue REST-Endpunkte ausdruecklich
# ("Neue Governance-/Control-Plane-Fachlogik oder neue REST-Endpunkte -- Owner:
# jeweiliger BC und eigene Story bei einem belegten Gap"). Der Gap ist belegt:
# 354 distinkte Symbole holt der Edge aus dem Kern, an 638 Importstellen; 179
# davon sind Daten (AG3-237), 116 sind Verhalten und 59 ungeklaert. Fuer den
# Verhaltensanteil gibt es ueber /v1 keine Operation.
#
# Ohne diese Storys stuende AG3-209 vor der Wahl, entweder den eigenen Scope zu
# brechen oder einen Schnitt zu vollziehen, nach dem der Edge seine Arbeit nicht
# mehr erledigen kann. Beides ist ausgeschlossen -- deshalb ziehen die zwoelf
# Storys VOR AG3-209.
#
# Die zwoelf sind untereinander unabhaengig (depends_on: []) und parallel
# ziehbar. Empfohlene Reihenfolge nach Hebel:
#   AG3-250 zuerst -- ein einziges Edge-Modul
#   (bootstrap/composition_project.py) erzeugt 18 der 23
#   state_backend-Ueberquerungen; danach AG3-243 (traegt den Ersatz fuer den
#   Sicherheitsdefekt aus AG3-239), dann AG3-239 und AG3-242 als groesste
#   Einzelposten, der Rest in beliebiger Ordnung.
