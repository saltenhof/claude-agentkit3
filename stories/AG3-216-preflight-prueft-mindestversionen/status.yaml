# Herkunft: Nebenbefund der Sonar-Remediation am 2026-08-04. Der AG3-180-
# Sicherheitsfix ruft ValidationError.errors(include_input=, include_url=) --
# eine API, die `pydantic>=2.0` nicht zusagte. Unter einer zulaessigen, aber zu
# alten Version haette der Fix einen TypeError geworfen statt zu redigieren.
#
# Der Einzelfall ist behoben (5db51bea, Untergrenze empirisch auf >=2.12). Die
# Luecke, die ihn moeglich gemacht hat, nicht: AG3-206 hat festgeschrieben,
# dass die Deklaration die einzige Paketwahrheit ist, und prueft nur
# Importierbarkeit. Damit gilt der Satz nur halb.
#
# Beidseitig relevant: das Repo pinnt auch nach oben (mcp<2, weaviate-client
# <5.0) und exakt (tokenizers==0.21.0, tomlkit==0.15.1). Ein Bereich, der nur
# nach unten durchgesetzt wird, ist halb durchgesetzt.
