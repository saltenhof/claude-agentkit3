# Tag, 90 davon "No module named 'tomlkit'" -- einer Pflicht-Abhaengigkeit, die
# seit jeher in pyproject.toml steht. Saemtliche Guards liefen NICHT; sie sind
# vor der ersten Zeile Fachlogik am Import gestorben.
#
# PO-Entscheidung vom 2026-08-03 (Decision Record
# 2026-08-03-abhaengigkeiten-leben-in-einer-venv.md): AK3 und seine
# Abhaengigkeiten leben in einer venv -- AK3 darf das System nicht verschmutzen.
# Zwingend hinzu kommt: AK3 und AK2 teilen den Paketnamen `agentkit`, eine
# globale Installation ueberschreibt AK2.
#
# Diese Story setzt die Entscheidung durch. Sie trifft sie nicht.
