title: "FK-10 verlangt zwei schreibende Backend-Prozesse, FK-91 genau einen Writer -- der zweite Prozess kann Claims des lebenden ersten als verwaist reconcilieren. Dazu vier weitere FK-10/FK-91-Abweichungen aus dem AG3-180-Umfeld."
type: implementation
