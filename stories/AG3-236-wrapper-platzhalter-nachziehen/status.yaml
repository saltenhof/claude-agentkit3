# Herkunft: AG3-208 Runde 2 (2026-08-07), nach dem AC-10-Review.
#
# AG3-208 hat `<absolute-agentkit-wrapper>` ZURUECKGEZOGEN. Der erste Versuch,
# ihn zentral als `agentkit-project-edge` umzudeuten, war der Fehler: Er
# korrigierte die Fundstellen nicht, sondern machte aus bisher MEHRDEUTIGEN
# Befehlen ausdruecklich FALSCHE --
#   `<absolute-agentkit-wrapper> serve`      obwohl `serve` dem Kern gehoert
#   `<absolute-agentkit-wrapper> dashboard`  obwohl es das Verb nicht gibt
#
# An seine Stelle treten vier eindeutige Platzhalter (Edge-CLI, Kern-CLI, zwei
# Hook-Wrapper), und die Aufloesungsregel lautet:
# DER VOLLSTAENDIGE KOMMANDOPFAD ENTSCHEIDET.
# NICHT "das Verb entscheidet" -- `auth` entscheidet gerade nicht:
# `auth bootstrap` gehoert dem Kern, die REST-Unterverben dem Edge.
#
# UMFANG, NEU GEMESSEN 2026-08-07 (die frueher hier stehende Zahl 154 war
# falsch): 162 Vorkommen auf 157 Zeilen in 49 Dateien.
# MESSSCOPE IST AUSDRUECKLICH `concept/` -- repo-weit waeren es 171 Vorkommen
# auf 166 Zeilen in 53 Dateien, weil die Storytexte mitzaehlen. Wer ohne
# Scope misst, bekommt eine andere Zahl und haelt sie fuer dieselbe.
# Unter concept/formal-spec/ sind es 18 DATEIEN (15 commands.md, 3 README.md),
# nicht 18 Fundstellen. Dazu ~40 bare `agentkit ...`-Befehlszeilen in FK-91
# 91.1 und FK-41, obwohl FK-10 das Script zurueckzieht.
#
# Das ist Schreibarbeit ohne fachliche Entscheidung -- die Entscheidung ist in
# AG3-208 gefallen. Genau deshalb ist es eine eigene Story: ein Massenrename
# gehoert nicht in einen Auftrag, der normative Grundsatzfragen klaert.
#
# MITZUFUEHREN, NICHT ZU LOESEN: Neun Verben aus den Fundstellen haben KEINE
# CLI-Entsprechung -- dashboard, resolve-conflict, structural, policy, stages,
# migrate, install, backend health. AG3-208 hat sie bewusst NICHT zugeordnet,
# weil ein Verb einer Distribution zuzuweisen, das es nicht gibt, ein
# heimatloser Eintrag mit erfundenem Eigentuemer waere. Sie sind vorbestehende
# Drift, Owner PO.
#
# KORREKTUR 2026-08-07: Es sind ELF Kommandopfade, nicht neun -- die alte Liste
# enthielt rechnerisch nur acht verschiedene Pfade, und der Korpus traegt drei
# weitere nicht implementierte Verben (approve-integration-manifest,
# amend-integration-manifest, guard-status, FK-91 91.1). Gegen den Dispatcher
# nachgezaehlt (cli/main.py, cli/auth_commands.py).
