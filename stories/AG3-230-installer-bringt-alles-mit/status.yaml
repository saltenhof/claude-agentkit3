story_id: AG3-230
story_title_short: "installer-bringt-alles-mit"
title: "Der Installer bringt alles mit: Project Edge laeuft ohne Verweis auf ein fremdes Verzeichnis, ohne Netzzugang und ohne AK3-Checkout auf der Zielmaschine."
type: implementation
status: blocked
# PO-KLARSTELLUNG 2026-08-06, woertlich: "Ich hab spezifiziert, dass da pro
# Entwicklerrechner dann eine Runtime installiert wird, eine Instanz, und die
# ganzen Projektinstanzen da drauf dann Zugriff nehmen. Und in welcher
# Reihenfolge das jetzt dann kommt, ob das eine Story frueher oder spaeter
# kommt, das ueberlass ich dir. Ich setz das Ganze eher erst ein, wenn Du fertig
# bist mit allen Stories."
#
# DAMIT IST DIE ARCHITEKTUR ENTSCHIEDEN und die Reihenfolge Sache des
# Orchestrators.
#
# ORCHESTRATOR-ENTSCHEID: AG3-208 -> AG3-209 -> AG3-230 -> AG3-217.
#
# Begruendung: Der einzige Grund fuer die fette Variante (ganze Distribution
# jetzt in die Runtime) war die Risikoluecke -- dass bis dahin jede
# registrierte Installation am Entwicklungsbaum haengt. Diese Luecke betrifft
# ausschliesslich `intima` und `ibkr-tax-analyzer` auf dem Rechner des PO, und
# der PO setzt erst nach Abschluss aller Storys ein. Damit entfaellt der Grund,
# 68 % des Kerns auf jede Maschine zu schieben und dafuer ein Wheelhouse fuer
# psycopg[binary] und tokenizers zu bauen -- Arbeit, die AG3-209 anschliessend
# wieder rueckgaengig macht.
#
# KEINE Wheelhouse-Freigabe noetig. Bleibt nach dem Distributionsschnitt eine
# Beschaffung uebrig, ist sie klein und wird dann konkret vorgelegt.
#
# BLOCKIERT auf AG3-209 (das seinerseits auf AG3-208 blockiert). Die
# Feasibility unten bleibt gueltig und ist der Startpunkt, sobald der Schnitt
# steht -- sie muss dann nur gegen die dann kleinere Modulmenge neu gemessen
# werden.
#
# GEMESSENER BEFUND, der die Frage aufwirft:
#   711 von 1042 Modulen (68 %) unter src/agentkit sind aus materialisiertem
#   Code erreichbar. Der materialisierte Edge-Code importiert den Kern selbst,
#   auf Modulebene (projectedge.py:20,21,30,35,36,39; check.py:28;
#   semantic_gate.py:132).
#
#   KORREKTUR 2026-08-07 (AG3-208 AC 7, zwei unabhaengige Messungen):
#   Die hier zuvor stehende Behauptung "der PreToolUse-Hook laedt bei jedem
#   Read/Grep den Postgres-Treiber" ist FALSCH. Der Import in
#   control_plane_writer_lease.py:32 steht unter TYPE_CHECKING. Laufzeit-
#   `sys.modules` und AST-Erreichbarkeit ueber alle 1042 Module zeigen
#   uebereinstimmend: unter den beobachteten DIREKTEN Abhaengigkeiten werden nur
#   `pydantic` und `pyyaml` geladen.
#
#   PRAEZISIERUNG 2026-08-07 (AG3-208 AC-10-Review): Diese Aussage darf nicht
#   als "nur diese zwei Module ueberhaupt" gelesen werden. Das Messskript prueft
#   eine hartcodierte Allowlist, in der u. a. `pydantic_core` und
#   `typing_extensions` fehlen -- allein `import pydantic` laedt beide. Belegt
#   ist die enge Aussage: der Postgres-Treiber wird NICHT geladen. `psycopg` ist
#   INSTALLIERT, nicht geladen -- der Befund traegt ueber die Anwesenheit, nicht
#   ueber den Ladevorgang.
#
#   Was stattdessen gemessen wurde und den Befund traegt: Der echte Hooklauf
#   (`agentkit-hook-claude pre branch_guard`, realer stdin, Exit 0) laedt
#   294 agentkit-Module aus 23 Backend-Subpaketen -- inklusive des
#   VOLLSTAENDIGEN verify_system (16 sonarqube_gate.*, 14 llm_evaluator.*,
#   adversarial_orchestrator, policy_engine), state_backend.store,
#   control_plane und installer. Ein PreToolUse auf `Read` laedt den
#   SonarQube-Gate-Code. Das Einzel-Wheel installiert 56 Distributionen.
#   harness_client/projectedge/ ist selbst nicht edge-rein: 9 von 13 Modulen
#   importieren backend.*.
#   Harte Drittabhaengigkeiten: pydantic, pyyaml, psycopg[binary],
#   psycopg-pool, packaging; lazy-aber-erforderlich: weaviate-client, mcp,
#   tokenizers.
#
# "Edge importiert den Kern nicht" ist damit keine Eigenschaft des Systems,
# sondern eine Absicht von AG3-208/209 -- und die ist NICHT BEGONNEN:
# AG3-208 = ready, AG3-209 = blocked (depends_on AG3-208).
#
# (Der frueher hier stehende Entscheidungsblock "fett jetzt gegen warten" ist
# entfallen -- er ist oben durch den Orchestrator-Entscheid beantwortet.)
#
# NEBENBEFUND, nicht angefasst: `agentkit-are-mcp` wird als MCP-Kommando
# registriert (core_types/mcp_server_registration.py:225,244), hat aber keinen
# Eintrag in [project.scripts]. Fail-closed ueber resolve_ak3_wrapper(),
# sobald features.are aktiv ist.
phase: setup
created: "2026-08-06"
size: L
# PO-VORGABE 2026-08-06, woertlich:
#
#   "Das Ziel-Setup ist ganz klar. Es gibt einen Installer, und der bringt
#    alles mit, was es braucht. Der darf nirgendwo hin verweisen auf
#    irgendwelche anderen Verzeichnisse und darauf bauen, dass dort schon
#    irgendwas rumliegt, was der lokale Hook oder sonst wer braucht. Und dann
#    haben wir auch ueberhaupt kein Problem mehr, dass irgendwo auf irgendeinem
#    anderen Rechner in der Codebase von AK3 ein instabiler Zustand herrscht,
#    weil davon kriegen die Projekte, die AK3 verwenden, ueberhaupt nichts mit."
#
# Das ist keine Entscheidung, sondern die Zielarchitektur. Backend auf dem
# zentralen Server; auf dem Entwicklerrechner liegt Project Edge, und alles,
# was dort hin soll, wird von AK3 explizit dorthin installiert -- inklusive
# saemtlicher Bibliotheken. Die Zielmaschine hat keinen Zugriff auf die
# AK3-Codebase und kann sich keine Python-Bibliotheken ziehen.
#
# BELEGTER IST-ZUSTAND (T:\codebase\intima, 2026-08-06):
#   installiert wurden ZWEI Dateien --
#     tools/agentkit/concept_toolchain
#     tools/agentkit/projectedge.py
#   keine eigene venv, keine Bibliotheken.
#
#   dafuer DREI Verweise zurueck auf den Entwicklungsbaum:
#     tools/hooks/pre-commit  'T:\codebase\claude-agentkit3\.venv\Scripts\python.exe'
#     .codex/config.toml      command = "T:\\codebase\\claude-agentkit3\\.venv\\..."
#     .agentkit/config/control-plane.json  "ca_file": "T:\\...\\var\\devcert\\cert.pem"
#
#   Auch der TLS-Vertrauensanker zeigt in den Entwicklungsbaum.
#
# URSACHE: `resolve_ak3_interpreter()` liefert `sys.executable` -- den
# Interpreter des Prozesses, der gerade installiert. Das ist richtig, solange
# der Installer INNERHALB der Project-Edge-Installation laeuft; hier lief er aus
# dem Quell-Checkout. Es gibt an dieser Stelle keine Trennung zwischen "wo AK3
# gerade laeuft" und "was auf der Zielmaschine liegen muss".
#
# FOLGE: Auf einer echten Client-Maschine gibt es kein
# T:\codebase\claude-agentkit3. Diese Installation waere tot, bevor sie das
# erste Mal laeuft. Was hier funktioniert, funktioniert ausschliesslich, weil
# Entwicklungsbaum und Zielprojekt auf derselben Platte liegen.
#
# Der intima-Totalausfall vom 2026-08-06 ist daraus vollstaendig erklaerbar:
# nicht "der Arbeitsbaum ist zufaellig produktiv", sondern es gibt gar keine
# installierte Fassung, die etwas anderes haette sein koennen.
depends_on: ["AG3-209"]
unblocks: ["AG3-217"]
