# 2026-08-04 abgeschlossen mit Commit 97db954e (zwei Reviewrunden, zwei
# Remediationen). ZWEI BENANNTE LUECKEN, ausdruecklich nicht "gruen":
#
#  1) GESCHLOSSEN am 2026-08-04. Der CP-10d-Test lief kurzzeitig mit dem Marker
#     `requires_gh` nicht in CI, weil das Jenkins-Image kein `gh` enthielt und
#     CP 2 dort korrekt fail-closed mit `repo_unreachable` scheiterte (Builds
#     #1222/#1223 rot). Statt den Nachweis zu schwaechen wurde das Werkzeug
#     beschafft (CLAUDE.md "FEHLENDES BESCHAFFEN STATT UMGEHEN"): `gh` 2.97.0
#     ist im gemeinsamen CI-Image (`seu-ci-infrastructure`, Commit 2899510),
#     der Token kommt zur Laufzeit aus der gitignorierten `jenkins/.env`.
#     Verifiziert im Container: `gh repo view openai/openai-python --json name`
#     -> {"name":"openai-python"}. Marker entfernt, der Pfad laeuft wieder in
#     CI. PO-Entscheid zum Token: der persoenliche gh-Token wird verwendet;
#     er traegt repo/workflow/project/gist/read:org, also vollen Schreibzugriff
#     -- ein dedizierter read-only Token waere die engere Wahl.
#  2) AC 1b hat keine echte Betriebssystemrechte-/Maschinentrennung im Nachweis
#     (Befund aus Reviewrunde 2). Testschaerfe-Luecke, kein Codedefekt.
#
# NACHTRAG 2026-08-04: Es gab einen DRITTEN offenen Punkt aus Reviewrunde 2 --
# einen FK-10/FK-91-Widerspruch ausserhalb des damaligen Mandats. Der
# Orchestrator hat ihn nie hier festgehalten; er ging mit dem Kontext verloren.
# Neu ermittelt in einer eigenen Befundrunde (job-fab88661) und geschnitten als
# AG3-214: FK-10 verlangt zwei schreibende Backend-Prozesse, FK-91 genau einen
# Writer -- der zweite kann Claims des lebenden ersten als verwaist
# reconcilieren. Vier weitere FK-10/FK-91-Abweichungen aus dem AG3-180-Umfeld
# kommen dazu, darunter nicht instanzgebundene Auth-Claims und ein
# Contract-Test, der den veralteten FK-91-CLI-Katalog einfriert.
#
# Die Lektion gehoert hierher, nicht nur nach AG3-214: ein Befund, der nur im
# Kontext des Orchestrators existiert, ist keiner. Offene Punkte gehoeren beim
# Auftreten in die status.yaml der Story, die sie erzeugt hat.
