# AG3-240 AC 1 -- one answer per boundary crossing of the bounded context
# `story-lifecycle`.
#
# answer:
#   a -- belongs over the interface: a /v1 endpoint carries it
#   b -- filed on the wrong side, or vocabulary that belongs in the contract
#        package: the module or the symbol MOVES, no endpoint
#   c -- must not happen at all: the call is removed
#
# `remedy_owner` names the story that can execute the answer. Where it is not
# AG3-240, the reason is named and, where it is a claim about numbers, MEASURED.
#
# SOURCES OF AUTHORITY USED HERE: `distributions`, `distribution_symbol_
# boundaries`, `wire_target_modules` and `wire_deferred_symbols` in
# `concept/formal-spec/architecture-conformance/entities.md`.
# `wire_excluded_crossings` is NOT used -- it carries
# `superseded-no-authority` (entities.md:3181, :3212) because AG3-237 did not
# carry it forward after the symbol cut. Review round 1 caught an earlier
# version of this file leaning on it.

measurement:
  command: >-
    .venv\Scripts\python
    stories/AG3-239-governance-endpunkte-fuer-den-edge/measure_boundary_violations.py
    --bc agentkit.backend.story_split --bc agentkit.backend.story_reset
    --bc agentkit.backend.story_exit --bc agentkit.backend.story_context_manager
    --bc agentkit.backend.story
  tool_note: >-
    The AG3-239 tool is USED, not copied. A second copy of a measurement script
    is a second measurement that drifts; the command above runs the same file
    that produced the AG3-239 numbers, so the figures are comparable.
  measured_on: "2026-08-08"
  start_value:
    unique_ordered_pairs: 19
    edge_to_core: 18
    core_to_edge: 1
    import_statements: 33
    distinct_imported_symbols: 22
  end_value:
    unique_ordered_pairs: 9
    edge_to_core: 8
    core_to_edge: 1
    import_statements: 17
    distinct_imported_symbols: 11
  repo_wide:
    before: 329
    after: 317
    note: >-
      329 is where AG3-239 left the repository. The "before" figure was taken by
      stashing the working tree, measuring, and restoring it. No crossing outside
      this bounded context was created.
  deviation_from_the_story_card: >-
    story.md gives 18 Edge->Kern pairs. The own measurement finds 18 edge-to-core
    AND one core-to-edge pair, i.e. 19. The card's figure was not wrong, it was
    one-directional. The 22 distinct symbols match exactly.

