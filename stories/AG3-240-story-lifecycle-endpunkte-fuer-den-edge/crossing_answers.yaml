# ---------------------------------------------------------------------------
# MEASURED, NOT ASSUMED
# ---------------------------------------------------------------------------

refuted_remedies:
  measured_on: "2026-08-08"
  method: >-
    The distribution of one module is overridden in the prefix map the AG3-239
    tool builds from the formal spec, and the full crossing set is recomputed.
    Nothing in `concept/` is modified.
  claim_under_test: >-
    "The remaining crossings are movements, so executing the movement lowers the
    number." -- the expectation AG3-239 review round 3 held.
  results:
    - move: story_context_manager.operating_mode_resolver -> edge
      repo_pairs: "321 -> 323 (unfair variant), 321 -> 321 (fair variant)"
      note: see the `measured` block of `hook-operating-mode-accessor`
    - move: story_context_manager.service -> edge
      repo_pairs: "321 -> 345"
      removed: 3
      created: 27
    - move: story_context_manager.story_model -> edge
      repo_pairs: "321 -> 361"
      removed: 2
      created: 42
  what_this_does_NOT_prove: >-
    Review round 1 rightly pushed back on an earlier version of this section: a
    whole-module reclassification experiment measures whether the MODULE belongs
    on the other side. It says nothing about whether an individual builder can be
    lifted out of a mixed module. That is why the three story-owned builders were
    extracted after all (`composition-project-story-builders`, 19 -> 11 -> 9) --
    the experiment had been used to justify not trying.

# ---------------------------------------------------------------------------

acceptance_criteria:
  ac1_every_crossing_answered: >-
    19 of 19. Ten resolved here, nine answered with a named owner, an anchor
    quoted from the document itself, and measurements where the reason is numeric.
  ac2_zero_violations: >-
    NOT reached: 19 -> 9. Reported as a gap, never as green. Of the nine, one
    pair-group waits on a Product-Owner decision AG3-237 explicitly declined to
    take, one is FK-91-mandated, one is FK-56-placed, and the rest need the
    edge-side story vocabulary that AG3-209 owns.
  ac3_no_endpoint_without_need: >-
    Held in the strongest form available: ZERO new endpoints. Every (a) answer
    resolves to an operation that already exists; the three mutations already ran
    over their /v1 operation before this story began. Nothing was built that had
    no call site.
  ac4_catalogued: >-
    No new or changed endpoint, so nothing to add. The three story-lifecycle
    operations are already in FK-91 section 91.1 (:142-144) with their CLI
    adapters (:596, :598, :602). No Formal-Spec change was made, so the shipped
    `check.py formal`/`frontmatter` run was not triggered.
  ac5_gates: >-
    All six binding deterministic gates exit 0, plus the interpreter guard. W2/W3
    were not run and are NOT counted as green.
  ac6_negative_paths: >-
    tests/unit/control_plane_http/test_story_lifecycle_routes.py. Split:
    unauthorised/non-strategist (403), defective plan (400), plan for another
    story (400), unreachable core (503). Reset: three unauthorised shapes (403),
    malformed payload (400), unknown story (409), unreachable core (503). Exit:
    three unauthorised shapes (403), unknown run identity (409), unknown reason
    code (400), unreachable core (503). The reset unknown-identity test was added
    after review round 1 found the earlier claim overstated.

open_items_for_the_product_owner:
  - >-
    `build_story_split_service` couples a core service to a local Weaviate
    adapter. AG3-237 named the PO as owner and did not decide it; AG3-240 did not
    either. Two crossings wait on it.
  - >-
    `resolve_operating_mode` has no executable home: FK-56:173 keeps it in the
    core, FK-01 section 1.2.3 keeps the hook off the network, and the edge move is
    measured as a wash. It needs a decision, not a default.
  - >-
    FK-91:142 requires the operator CLI to send VALIDATED plan text, which keeps
    the plan contract on both machines. If the writer should be the sole
    validator, FK-91 has to say so; this story did not change it.
