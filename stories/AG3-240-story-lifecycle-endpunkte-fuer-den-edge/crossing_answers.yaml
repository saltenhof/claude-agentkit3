    answer: b
    remedy_owner: Product Owner, then AG3-209
    blocked: true
    anchor: >-
      architecture-conformance.symbol_boundary.bootstrap_composition_project,
      field `unresolved`
    rationale: >-
      `build_story_split_service` builds a CORE service AND resolves a Weaviate
      adapter locally (composition_project.py:114,171 before the extraction).
      AG3-237 recorded exactly this as an open question whose "owner is the
      Product Owner" and refused to decide it a second time; AG3-240 does not
      decide it either, so the builder stays put and its two crossings stay with
      it. Its sibling `resolve_split_export_project_id` carries the same flag.
    second_cause_of_the_story_context_manager_pair: >-
      The `story_context_manager.service` pair also has a SECOND cause at
      composition_project.py:383, `build_project_read_model_routes`. That is
      project-management wiring that happens to construct a story service; it
      belongs to that bounded context and is not this story's to move. Removing
      only the split builder would therefore not clear this pair.

  - id: cli-story-read-for-story-md-export
    pairs:
      - agentkit.backend.cli.story_commands -> agentkit.backend.story_context_manager.service
    symbols: [StoryService]
    answer: a
    remedy_owner: AG3-209
    blocked: true
    endpoint: >-
      `GET /v1/stories/{story_id}` (story_context_manager/http/routes.py:131-152)
      already returns exactly the needed pair: `{"summary": ..., "spec": ...}`,
      serialised by `story_to_wire_summary` / `story_spec_to_wire` from
      `service.get_story_detail() -> (Story, StorySpecification | None)`.
    correction_from_review_round_1: >-
      An earlier version of this file named the PROJECT-SCOPED
      `GET /v1/projects/{key}/stories/{id}` and claimed it returns the
      specification. It does not: that route answers `backend.story.models.
      StoryDetail` (story/models.py:79), which has no specification field. The
      locator was wrong; the answer (a) survives against the correct route.
    why_not_executable_here: >-
      `export-story-md` consumes the port
      `StoryAttributesPort.get_story_detail() -> (Story, StorySpecification|None)`
      (story_md_export.py:68). The port and its consumer are EDGE
      (`agentkit.backend.story_creation` is an edge prefix), so the edge needs
      its own model of a story before a REST client can satisfy that port -- the
      JSON is already there, the edge-side type is not. Minting that type is the
      same work as the two `story_model` crossings below and belongs with them.

  - id: cli-split-plan-validation
    pairs:
      - agentkit.backend.cli.story_commands -> agentkit.backend.story_split.plan_loader
    symbols: [SplitPlanError, load_split_plan]
    answer: a
    remedy_owner: AG3-209
    blocked: true
    anchor: >-
      FK-91 section 91.1, 91_api_event_katalog.md:142 -- "Der Operator-CLI sendet
      den VALIDIERTEN Plantext ... ueber HTTPS".
    history: >-
      This story first answered (c) and removed the local validation, on the
      grounds that the route validates the same document again. Review round 1
      showed that FK-91 binds the CLI to sending validated text, so the removal
      contradicted a normative document. It was REVERTED rather than resolved by
      changing FK-91 -- the concept change is the large solution and nobody
      ordered it.
    what_was_kept_from_the_attempt: >-
      The duplication itself is gone even though the crossing is back.
      `plan_loader` now has ONE validation implementation, `parse_split_plan`,
      with two entries: `load_split_plan(path)` for the edge and
      `parse_split_plan(text)` for the writer, which no longer reimplements
      `json.loads` + `SplitPlan.model_validate` inline in the route. Validated
      means the same thing on both sides -- one rule checked twice, not two rules.
    rationale: >-
      As long as FK-91 requires the edge to send validated text, the edge needs
      the plan contract, and a plan contract that both sides must apply is /v1
      vocabulary. The resolution is therefore the same class of work as the
      `story_model` items: an edge-reachable plan type. Not a new endpoint --
      the split endpoint exists.

