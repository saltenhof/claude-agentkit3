      belongs there -- `agentkit_wire` carries /v1 vocabulary, not shared
      behaviour, a rule this story wrote into the package docstring itself.
    correction_from_review_round_1: >-
      An earlier version of this file called `agentkit_wire.operating_mode` the
      accessor's "correct home". That contradicted both FK-56:173 and the wire
      rule, and it was argued from an unfair experiment (the resolver was moved
      to the edge while the already-specified `OperatingMode` migration was left
      undone). Both the claim and the experiment are replaced below.
    measured:
      - step: "core_types.operating_mode -> wire (the specified, foreign-owned step)"
        result: "repo 321 -> 320; removes 1, creates 0"
        note: >-
          The pair it removes is the resolver's own import of the type. The
          `guard_evaluation -> resolver` crossing SURVIVES it -- verified
          directly, not inferred.
      - step: "the above PLUS resolver -> edge (the coordinated cut, fairly tested)"
        result: "repo 321 -> 321; removes 2, creates 2"
        note: >-
          Even done coordinately, moving the resolver to the edge is a wash: the
          two core consumers `governance.integrity_gate` and
          `integrity_gate.mode_guard` simply become the new violators. So the cut
          is not blocked by the unfinished type migration; it does not pay at all.
    open: >-
      This crossing has an answer for the TYPE and no executable answer for the
      ACCESSOR. FK-56 keeps the accessor in the core, FK-01 keeps the hook off
      the network, and measurement rules out the edge. Escalated rather than
      resolved by a default.

