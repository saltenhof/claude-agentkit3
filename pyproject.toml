[build-system]
requires = ["hatchling"]
build-backend = "agentkit.backend.installer.build_backend"
backend-path = ["src"]

[project]
name = "agentkit"
version = "0.1.0"
description = "Deterministic orchestration engine for AI-driven story execution"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Stefan Altenhof" },
]
dependencies = [
    "argon2-cffi>=23.1",
    # >=2.12: the auth HTTP surface calls ValidationError.errors(include_input=,
    # include_url=) so a secret can never reach an error response (AG3-180).
    # `>=2.0` did not cover that keyword, so the declaration permitted a version
    # on which the security fix raises TypeError instead of redacting. 2.12.0 is
    # the lowest version verified to carry the keyword on the interpreter this
    # project actually runs on; 2.1.0 has no wheel for Python 3.14 at all.
    "pydantic>=2.12",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pyyaml>=6.0",
    "psutil>=5.9",
    # Official MCP Python SDK — runtime contract oracle for installer
    # conformance payload validation (AG3-164) AND the FK-13 §13.4 story
    # knowledge base MCP server (AG3-174). Hard dependency: no optional import /
    # soft fallback at the registration gate or the tool surface.
    # Bounded on BOTH sides against the v1 surface this code actually uses:
    # ``mcp.server.fastmcp`` (the FastMCP server the tool surface subclasses)
    # only exists from 1.2.0 onwards, and 2.0.0 ships neither
    # ``mcp/server/fastmcp`` nor ``mcp/types`` — it moved the server to
    # ``mcp.server.mcpserver``. Either edge breaks the MANDATORY MCP server at
    # import time, so an unbounded range is a fail-open install. The ``cli``
    # extra is deliberately NOT required — it only adds typer/python-dotenv for
    # the standalone ``mcp`` command, which AK3 does not use.
    "mcp>=1.2.0,<2",
    # Weaviate story-knowledge-base runtime (FK-13 §13.2). Now a MANDATORY
    # infrastructure dependency (DR 2026-07-21 Rand 1: feature flag is a
    # deprecated migration key). Runtime pin per FK-13 §13.2 instead of the
    # former optional `>=4.0` extra (Review 174-P1-3): the integration adapter
    # guards the import and fails closed when the package is absent, but the
    # package itself is part of the base install.
    "weaviate-client>=4.9,<5.0",
    # Bound tokenizer for deterministic chunk sizing (FK-13 §13.2). Pinned
    # exactly per PO decision D5; drift here would silently change chunk
    # boundaries. The shipped asset is still the MiniLM WordPiece tokenizer
    # while the embedding model pin has moved to `BAAI/bge-m3` — a named,
    # deliberate gap that affects ingest chunk sizing only (decision record
    # 2026-08-02 "Modellpin folgt der laufenden Infrastruktur", §2.3).
    "tokenizers==0.21.0",
    # Round-trip TOML writer for the project-local `.codex/config.toml` MCP
    # registration (FK-76 §76.5.4, AG3-175 decision D-1, PO-approved).
    # `tomllib` (stdlib) reads only. tomlkit is the sole option that preserves
    # FOREIGN comments, formatting and key order on a semantic merge: a
    # value-only writer would delete a target project's own Codex comments, and
    # the AK3-ownership predicate would then classify the file as AK3-only so
    # detach would DELETE it — turning "a comment was lost" into "the file was
    # removed". Pinned exactly (same discipline as PO decision D5). MIT licence,
    # pure Python, no transitive runtime dependencies. Wrapped behind ONE import
    # point (`harness_adapters/codex_config_toml.py`) per guardrail ARCH-23.
    "tomlkit==0.15.1",
]

[project.optional-dependencies]
dev = [
    # Build-time requirement AND a dev requirement since AG3-189: the in-tree
    # PEP-517 backend (`installer/build_backend.py`) imports it at module
    # level, so `mypy src` needs it importable. pip provides build requirements
    # only inside an isolated build environment, never in the project venv --
    # locally it is present as a build leftover, in CI it is not. Without this
    # line mypy passes on a developer machine and fails on Jenkins with
    # `import-not-found` plus four cascading `no-any-return`.
    "hatchling",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[project.scripts]
agentkit = "agentkit.backend.cli.main:main"
agentkit-hook-claude = "agentkit.harness_client.harness_adapters.claude_code:main"
agentkit-hook-codex = "agentkit.harness_client.harness_adapters.codex.cli:main"

[tool.hatch.build.targets.wheel]
# `agentkit_wire` is the /v1 contract vocabulary both machines import (FK-10).
# It is a second import root, NOT a second distribution -- the wheel split into
# agentkit-project-edge / agentkit-backend / agentkit-wire is owned by AG3-209.
packages = ["src/agentkit", "src/agentkit_wire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallelize across a BOUNDED worker count (pytest-xdist). ``-n 4`` (never
# ``-n auto``) caps the fan-out at 4 workers: each Postgres-backed worker holds ONE
# pooled DB connection (see postgres_store pool, default max_size=1), so the total
# concurrent DB footprint stays small and the Docker-Desktop userspace port proxy is
# never driven into the multi-core burn that ``-n auto`` (up to 24 workers x
# connect-churn) caused. ``loadfile`` keeps each test file on one worker, so
# module-level fixtures and any not-fully-isolated tests stay safe while files fan
# out across workers. Override with ``-n0`` for a serial run.
addopts = "-n 4 --dist loadfile"
markers = [
    "slow: marks tests as slow",
    "requires_git: marks tests requiring git",
    "requires_gh: marks tests requiring GitHub CLI",
    "unit: unit tests",
    "integration: integration tests",
    "contract: contract/snapshot tests",
    "e2e: end-to-end tests against live systems",
]
# Text I/O that takes the platform's preferred encoding is a defect, not a
# style question: it decodes the same bytes differently on Windows than on
# Linux. `PYTHONWARNDEFAULTENCODING=1` makes the interpreter report every such
# call site as `EncodingWarning`; this entry turns it into a test failure.
#
# It covers THIS interpreter only. `PYTHONWARNINGS=error::EncodingWarning` does
# the same across the process boundary, which a pytest filter cannot reach; the
# CI stages set both. That variable also reaches FOREIGN children, so the one
# place that spawns `mypy` drops it again -- named there, not switched off for
# everyone. tests/contract/backend/test_subprocess_text_encoding.py proves the
# mechanism fires instead of assuming it.
filterwarnings = ["error::EncodingWarning"]

[tool.coverage.run]
source = ["agentkit"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
strict = true
# The checked set is declared HERE and nowhere else, so `mypy` without arguments
# is the whole truth. Passing a path on the command line silently replaces this
# list -- which is exactly how `scripts/` and `tools/` stayed unchecked while the
# Jenkins stage ran `mypy src` and looked green (AG3-218).
#
# `files` rather than `packages`: `scripts/ci/*.py` are executed as standalone
# scripts, not imported as a package, so they have no package name to name. The
# module identities that come out of these three roots are the identities the
# code really runs under -- `agentkit.*` from `src`, `concept_compiler.*` /
# `concept_governance.*` / `concept_ingester.*` / `concept_mcp.*` /
# `diagram_export.*` from `tools` (the roots on `mypy_path` below), and each
# `check_*` script as its own top-level module. A directory list also needs no
# maintenance when a package or a script is added.
files = ["src", "scripts", "tools"]
mypy_path = ["src", "tools", "scripts/ci"]
plugins = ["pydantic.mypy"]

# Weaviate is a MANDATORY but UNTYPED dependency (FK-13 §13.1/§13.2). It ships
# no stubs, and the integration adapter guards its import so a broken install
# fails closed with a typed error; mypy must therefore not fail on the missing
# stubs. This is a typing seam, NOT an optionality statement — only the
# ``weaviate.*`` namespace is exempted.
[[tool.mypy.overrides]]
module = ["weaviate.*"]
ignore_missing_imports = true

# The bound tokenizers library (FK-13 §13.2, PO decision D5) ships without
# type stubs; the loader guards the import and the semantics are verified by
# real tests. Only the ``tokenizers.*`` namespace is exempted.
[[tool.mypy.overrides]]
module = ["tokenizers.*"]
ignore_missing_imports = true

[tool.ruff]
src = ["src", "tests"]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "C90"]

[tool.ruff.lint.mccabe]
# Local proxy for Sonar S3776 (Cognitive Complexity); catches overly complex
# functions in the mandatory ruff pre-push run instead of only via Sonar on Jenkins.
max-complexity = 15

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
